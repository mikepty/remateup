services:
  - type: web
    name: remateup-backend
    runtime: python
    plan: free
    pythonVersion: "3.12"
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: remateup-db
          property: connectionString
    autoDeploy: true

  - type: postgres
    name: remateup-db
    plan: free
    databaseName: remateup
